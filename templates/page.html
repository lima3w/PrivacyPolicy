{% extends "base.html" %}

{% block title %}{{ page.title }} — {{ config.title }}{% endblock title %}

{% block content %}
<article class="policy">
  <h1>{{ page.title }}</h1>
  <p class="meta">Last updated {{ page.date }} · Version {{ config.extra.policy_version }}</p>

  {{ page.content | safe }}

  <p class="back"><a href="{{ get_url(path="") }}">&larr; Back to the Lima3 Privacy Policy</a></p>
</article>
{% endblock content %}
